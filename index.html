<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>3D Environment</title>
    <link rel="stylesheet" href="./style.css">
    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
        "three/examples/jsm/controls/OrbitControls.js": "https://unpkg.com/three@0.170.0/examples/jsm/controls/OrbitControls.js",
        "three/examples/jsm/loaders/RGBELoader.js": "https://unpkg.com/three@0.170.0/examples/jsm/loaders/RGBELoader.js",
        "three/examples/jsm/loaders/GLTFLoader.js": "https://unpkg.com/three@0.170.0/examples/jsm/loaders/GLTFLoader.js"
      }
    }
    </script>
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <!-- Fullscreen 3D Canvas -->
    <canvas id="webgl"></canvas>

    <!-- Sleek Loading Overlay -->
    <div id="loader" class="loader-overlay">
      <div class="loader-card">
        <div class="loader-spinner"></div>
        <h2 id="loader-status">Loading 3D Environment...</h2>
        <div class="progress-bar-bg">
          <div id="loader-progress" class="progress-bar-fill"></div>
        </div>
        <p id="loader-details">Loading 4K Sky & 3D City Buildings...</p>
      </div>
    </div>

    <!-- Minimal Interaction Tip -->
    <div class="controls-hint">
      <span>🖱️ <strong>Left Click:</strong> Rotate 360°</span>
      <span>•</span>
      <span><strong>Right Click:</strong> Pan</span>
      <span>•</span>
      <span><strong>Scroll:</strong> Zoom</span>
    </div>

    <!-- Top Left Studio Settings & Transform Panel -->
    <div class="studio-panel" id="studio-panel">
      <!-- Header with Toggle Button -->
      <div class="studio-header" id="studio-header">
        <div class="studio-title">
          <span>⚙️</span>
          <span>Studio Controls</span>
        </div>
        <button class="studio-toggle-btn" id="studio-toggle-btn" title="Toggle Controls" aria-label="Toggle Studio Controls">−</button>
      </div>

      <div class="studio-body" id="studio-body">
        <!-- Presets & Saved Scenes Section -->
        <div class="studio-section">
          <label class="section-label">💾 GitHub Presets</label>
          <select id="preset-select" class="studio-select" aria-label="Select Saved Preset">
            <option value="default">Default Daytime</option>
            <option value="sunset">Sunset Autumn Vista</option>
            <option value="cyberpunk">Cyberpunk Night</option>
          </select>
          <div class="action-btn-group" style="margin-top: 6px;">
            <button class="studio-btn primary" id="btn-copy-preset" style="flex: 1;" title="Copy current scene settings to paste in chat">📋 Copy Config</button>
            <button class="studio-btn secondary" id="btn-export-preset" style="flex: 1;" title="Download preset as JSON file">📥 Download</button>
          </div>
          <div id="preset-status" class="duplicate-status"></div>
        </div>

        <!-- Target Object Selector (Supports Main & All Clones) -->
        <div class="studio-section">
          <label class="section-label">Active Target Object</label>
          <select id="active-object-select" class="studio-select" aria-label="Select Active Object to Move or Rotate">
            <option value="buildings_0">🏙️ Buildings (Main)</option>
            <option value="mountains_0">⛰️ Mountains (Main)</option>
          </select>
        </div>

        <!-- Position Controls (X, Y Elevation, Z) -->
        <div class="studio-section">
          <label class="section-label">Position / Elevation</label>
          <div class="slider-row">
            <span class="axis-badge">X</span>
            <input type="range" id="pos-x-slider" class="styled-slider studio-slider" min="-250" max="250" value="0" />
            <span class="val-display" id="pos-x-val">0m</span>
          </div>
          <div class="slider-row">
            <span class="axis-badge">Y</span>
            <input type="range" id="pos-y-slider" class="styled-slider studio-slider" min="-30" max="80" value="0" />
            <span class="val-display" id="pos-y-val">0m</span>
          </div>
          <div class="slider-row">
            <span class="axis-badge">Z</span>
            <input type="range" id="pos-z-slider" class="styled-slider studio-slider" min="-250" max="250" value="0" />
            <span class="val-display" id="pos-z-val">0m</span>
          </div>
        </div>

        <!-- Rotation Controls (Yaw) -->
        <div class="studio-section">
          <label class="section-label">Rotation</label>
          <div class="slider-row">
            <span class="axis-badge">↻</span>
            <input type="range" id="rot-y-slider" class="styled-slider studio-slider" min="0" max="360" value="0" />
            <span class="val-display" id="rot-y-val">0°</span>
          </div>
        </div>

        <!-- Actions: Duplicate, Reset & Delete Clone -->
        <div class="studio-section">
          <div class="action-btn-group">
            <button class="studio-btn primary" id="btn-duplicate-target" title="Duplicate selected object with offset">📋 Duplicate</button>
            <button class="studio-btn secondary" id="btn-reset-target" title="Reset position and rotation to origin">↺ Reset</button>
          </div>
          <button class="studio-btn danger" id="btn-delete-clone" style="display: none; margin-top: 5px;" title="Delete this duplicate clone">🗑️ Delete Clone</button>
          <div id="duplicate-status" class="duplicate-status"></div>
        </div>

        <!-- Mountain Style Selector (Independent from Ground) -->
        <div class="studio-section">
          <label class="section-label">⛰️ Mountain Style</label>
          <select id="mountain-style-select" class="studio-select" aria-label="Select Mountain Style">
            <option value="natural">🌿 Original Natural</option>
            <option value="stone">🪨 Rocky Mountain</option>
            <option value="snow">❄️ Snowy Peaks</option>
            <option value="canyon">🏜️ Desert Canyon</option>
            <option value="moss">🌲 Lush Forest / Moss</option>
            <option value="autumn">🍁 Autumn Hills</option>
            <option value="lava">🌋 Volcanic Lava</option>
            <option value="sand">🏖️ Golden Sand</option>
            <option value="marble">🏛️ Carrara Marble</option>
            <option value="hexgrid">🔮 Cyberpunk Hex</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Top Right Combined Controls Card (Brightness + Sky Movement) -->
    <div class="top-controls-card" id="top-controls-card">
      <!-- Minimize Header -->
      <div class="top-controls-header" id="top-controls-header">
        <div class="top-controls-title">
          <span>☀️</span>
          <span>Atmosphere & Sky</span>
        </div>
        <button class="top-controls-toggle-btn" id="top-controls-toggle-btn" title="Toggle Atmosphere Controls" aria-label="Toggle Atmosphere Controls">−</button>
      </div>

      <div class="top-controls-body" id="top-controls-body">
        <!-- 1. Day to Night Brightness -->
        <div class="control-row">
          <span class="ctrl-icon moon-icon" id="btn-night" title="Night">🌙</span>
          <input
            type="range"
            id="brightness-slider"
            class="styled-slider brightness-slider"
            min="0"
            max="100"
            value="85"
            aria-label="Brightness Level Day to Night"
          />
          <span class="ctrl-icon sun-icon" id="btn-day" title="Day">☀️</span>
        </div>

        <!-- 2. Sky Cloud Rotation Speed -->
        <div class="control-row">
          <span class="ctrl-icon" id="btn-pause-sky" title="Pause Sky">⏸️</span>
          <input
            type="range"
            id="sky-speed-slider"
            class="styled-slider speed-slider"
            min="0"
            max="100"
            value="35"
            aria-label="Sky Cloud Speed"
          />
          <span class="ctrl-icon" id="btn-fast-sky" title="Fast Clouds">💨</span>
        </div>

        <!-- 3. Sky Rotation Direction Pills -->
        <div class="direction-pills" id="sky-direction-picker">
          <button class="dir-btn active" data-dir="E_W" title="East to West">E → W</button>
          <button class="dir-btn" data-dir="W_E" title="West to East">W → E</button>
          <button class="dir-btn" data-dir="N_S" title="North to South">N → S</button>
          <button class="dir-btn" data-dir="S_N" title="South to North">S → N</button>
          <button class="dir-btn" data-dir="NE_SW" title="Northeast to Southwest">NE ↙</button>
          <button class="dir-btn" data-dir="NW_SE" title="Northwest to Southeast">NW ↘</button>
        </div>

        <!-- 4. Mini Default Button (Reset to original position with 0 speed) -->
        <button class="reset-sky-btn" id="btn-reset-sky" title="Reset Sky to Original Position with 0 Speed">↺ Default Sky</button>
      </div>
    </div>

    <!-- Minimal Ground Switcher Column (Right Center) -->
    <div class="ground-picker" id="ground-picker">
      <button class="ground-box active" data-ground="grass" style="--thumb: url('./textures/grass.jpg');" aria-label="Grass"></button>
      <button class="ground-box" data-ground="moss" style="--thumb: url('./textures/moss.jpg');" aria-label="Mossy Rock"></button>
      <button class="ground-box" data-ground="autumn" style="--thumb: url('./textures/autumn.jpg');" aria-label="Autumn Forest"></button>
      <button class="ground-box" data-ground="sand" style="--thumb: url('./textures/sand.jpg');" aria-label="Desert Sand"></button>
      <button class="ground-box" data-ground="canyon" style="--thumb: url('./textures/canyon.jpg');" aria-label="Cracked Canyon Clay"></button>
      <button class="ground-box" data-ground="snow" style="--thumb: url('./textures/snow.jpg');" aria-label="Arctic Snow"></button>
      <button class="ground-box" data-ground="water" style="--thumb: url('./textures/water.jpg');" aria-label="Ocean Water"></button>
      <button class="ground-box" data-ground="stone" style="--thumb: url('./textures/stone.jpg');" aria-label="Cobblestone Pavers"></button>
      <button class="ground-box" data-ground="asphalt" style="--thumb: url('./textures/asphalt.jpg');" aria-label="City Asphalt"></button>
      <button class="ground-box" data-ground="lava" style="--thumb: url('./textures/lava.jpg');" aria-label="Volcanic Lava"></button>
      <button class="ground-box" data-ground="hexgrid" style="--thumb: url('./textures/hexgrid.jpg');" aria-label="Cyberpunk Hex Grid"></button>
      <button class="ground-box" data-ground="marble" style="--thumb: url('./textures/marble.jpg');" aria-label="Carrara Marble"></button>
    </div>

  </body>
</html>
