<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>3D Environment</title>
    <link rel="stylesheet" href="./style.css">
    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
        "three/examples/jsm/controls/OrbitControls.js": "https://unpkg.com/three@0.170.0/examples/jsm/controls/OrbitControls.js",
        "three/examples/jsm/loaders/RGBELoader.js": "https://unpkg.com/three@0.170.0/examples/jsm/loaders/RGBELoader.js",
        "three/examples/jsm/loaders/GLTFLoader.js": "https://unpkg.com/three@0.170.0/examples/jsm/loaders/GLTFLoader.js"
      }
    }
    </script>
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <!-- Fullscreen 3D Canvas -->
    <canvas id="webgl"></canvas>

    <!-- Sleek Loading Overlay -->
    <div id="loader" class="loader-overlay">
      <div class="loader-card">
        <div class="loader-spinner"></div>
        <h2 id="loader-status">Loading 3D Environment...</h2>
        <div class="progress-bar-bg">
          <div id="loader-progress" class="progress-bar-fill"></div>
        </div>
        <p id="loader-details">Loading 4K Sky & 3D City Buildings...</p>
      </div>
    </div>

    <!-- Minimal Interaction Tip -->
    <div class="controls-hint">
      <span>🖱️ <strong>Left Click:</strong> Rotate 360°</span>
      <span>•</span>
      <span><strong>Right Click:</strong> Pan</span>
      <span>•</span>
      <span><strong>Scroll:</strong> Zoom</span>
    </div>

    <!-- Top Right Day-to-Night Brightness Slider -->
    <div class="brightness-control" id="brightness-control">
      <span class="brightness-icon moon-icon" id="btn-night" title="Night">🌙</span>
      <input
        type="range"
        id="brightness-slider"
        min="0"
        max="100"
        value="85"
        aria-label="Brightness Level Day to Night"
      />
      <span class="brightness-icon sun-icon" id="btn-day" title="Day">☀️</span>
    </div>

    <!-- Minimal Ground Switcher Column (Right Center) -->
    <div class="ground-picker" id="ground-picker">
      <button class="ground-box active" data-ground="grass" style="--thumb: url('./textures/grass.jpg');" aria-label="Grass"></button>
      <button class="ground-box" data-ground="moss" style="--thumb: url('./textures/moss.jpg');" aria-label="Mossy Rock"></button>
      <button class="ground-box" data-ground="autumn" style="--thumb: url('./textures/autumn.jpg');" aria-label="Autumn Forest"></button>
      <button class="ground-box" data-ground="sand" style="--thumb: url('./textures/sand.jpg');" aria-label="Desert Sand"></button>
      <button class="ground-box" data-ground="canyon" style="--thumb: url('./textures/canyon.jpg');" aria-label="Cracked Canyon Clay"></button>
      <button class="ground-box" data-ground="snow" style="--thumb: url('./textures/snow.jpg');" aria-label="Arctic Snow"></button>
      <button class="ground-box" data-ground="water" style="--thumb: url('./textures/water.jpg');" aria-label="Ocean Water"></button>
      <button class="ground-box" data-ground="stone" style="--thumb: url('./textures/stone.jpg');" aria-label="Cobblestone Pavers"></button>
      <button class="ground-box" data-ground="asphalt" style="--thumb: url('./textures/asphalt.jpg');" aria-label="City Asphalt"></button>
      <button class="ground-box" data-ground="lava" style="--thumb: url('./textures/lava.jpg');" aria-label="Volcanic Lava"></button>
      <button class="ground-box" data-ground="hexgrid" style="--thumb: url('./textures/hexgrid.jpg');" aria-label="Cyberpunk Hex Grid"></button>
      <button class="ground-box" data-ground="marble" style="--thumb: url('./textures/marble.jpg');" aria-label="Carrara Marble"></button>
    </div>

  </body>
</html>
