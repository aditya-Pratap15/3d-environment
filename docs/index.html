<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>3D Environment</title>

    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
        "three/examples/jsm/controls/OrbitControls.js": "https://unpkg.com/three@0.170.0/examples/jsm/controls/OrbitControls.js",
        "three/examples/jsm/loaders/RGBELoader.js": "https://unpkg.com/three@0.170.0/examples/jsm/loaders/RGBELoader.js",
        "three/examples/jsm/loaders/GLTFLoader.js": "https://unpkg.com/three@0.170.0/examples/jsm/loaders/GLTFLoader.js"
      }
    }
    </script>
    <script type="module" crossorigin src="./assets/index-iTUnyIKo.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DPsgjGro.css">
  </head>
  <body>
    <!-- Fullscreen 3D Canvas -->
    <canvas id="webgl"></canvas>

    <!-- Sleek Loading Overlay -->
    <div id="loader" class="loader-overlay">
      <div class="loader-card">
        <div class="loader-spinner"></div>
        <h2 id="loader-status">Loading 3D Environment...</h2>
        <div class="progress-bar-bg">
          <div id="loader-progress" class="progress-bar-fill"></div>
        </div>
        <p id="loader-details">Loading 4K Sky & 3D City Buildings...</p>
      </div>
    </div>

    <!-- Minimal Interaction Tip -->
    <div class="controls-hint">
      <span>🖱️ <strong>Left Click:</strong> Rotate 360°</span>
      <span>•</span>
      <span><strong>Right Click:</strong> Pan</span>
      <span>•</span>
      <span><strong>Scroll:</strong> Zoom</span>
    </div>

    <!-- Top Right Combined Controls Card (Brightness + Sky Movement) -->
    <div class="top-controls-card" id="top-controls-card">
      <!-- 1. Day to Night Brightness -->
      <div class="control-row">
        <span class="ctrl-icon moon-icon" id="btn-night" title="Night">🌙</span>
        <input
          type="range"
          id="brightness-slider"
          class="styled-slider brightness-slider"
          min="0"
          max="100"
          value="85"
          aria-label="Brightness Level Day to Night"
        />
        <span class="ctrl-icon sun-icon" id="btn-day" title="Day">☀️</span>
      </div>

      <!-- 2. Sky Cloud Rotation Speed -->
      <div class="control-row">
        <span class="ctrl-icon" id="btn-pause-sky" title="Pause Sky">⏸️</span>
        <input
          type="range"
          id="sky-speed-slider"
          class="styled-slider speed-slider"
          min="0"
          max="100"
          value="25"
          aria-label="Sky Cloud Speed"
        />
        <span class="ctrl-icon" id="btn-fast-sky" title="Fast Clouds">💨</span>
      </div>

      <!-- 3. Sky Rotation Direction Pills -->
      <div class="direction-pills" id="sky-direction-picker">
        <button class="dir-btn active" data-dir="E_W" title="East to West">E → W</button>
        <button class="dir-btn" data-dir="W_E" title="West to East">W → E</button>
        <button class="dir-btn" data-dir="N_S" title="North to South">N → S</button>
        <button class="dir-btn" data-dir="S_N" title="South to North">S → N</button>
        <button class="dir-btn" data-dir="NE_SW" title="Northeast to Southwest">NE ↙</button>
        <button class="dir-btn" data-dir="NW_SE" title="Northwest to Southeast">NW ↘</button>
      </div>
    </div>

    <!-- Minimal Ground Switcher Column (Right Center) -->
    <div class="ground-picker" id="ground-picker">
      <button class="ground-box active" data-ground="grass" style="--thumb: url('./assets/grass-C7l3qqVw.jpg');" aria-label="Grass"></button>
      <button class="ground-box" data-ground="moss" style="--thumb: url('./assets/moss-DPRy-t_o.jpg');" aria-label="Mossy Rock"></button>
      <button class="ground-box" data-ground="autumn" style="--thumb: url('./assets/autumn-DnVYTTkF.jpg');" aria-label="Autumn Forest"></button>
      <button class="ground-box" data-ground="sand" style="--thumb: url('./assets/sand-DCFF4UZ5.jpg');" aria-label="Desert Sand"></button>
      <button class="ground-box" data-ground="canyon" style="--thumb: url('./assets/canyon-BZw4Avm7.jpg');" aria-label="Cracked Canyon Clay"></button>
      <button class="ground-box" data-ground="snow" style="--thumb: url('./assets/snow-B3cdlIco.jpg');" aria-label="Arctic Snow"></button>
      <button class="ground-box" data-ground="water" style="--thumb: url('./assets/water-08gbcjxb.jpg');" aria-label="Ocean Water"></button>
      <button class="ground-box" data-ground="stone" style="--thumb: url('./assets/stone-D51VxxOL.jpg');" aria-label="Cobblestone Pavers"></button>
      <button class="ground-box" data-ground="asphalt" style="--thumb: url('./assets/asphalt-CUbqJsvH.jpg');" aria-label="City Asphalt"></button>
      <button class="ground-box" data-ground="lava" style="--thumb: url('./assets/lava-BNkCFdBY.jpg');" aria-label="Volcanic Lava"></button>
      <button class="ground-box" data-ground="hexgrid" style="--thumb: url('./assets/hexgrid-ktSBqAjO.jpg');" aria-label="Cyberpunk Hex Grid"></button>
      <button class="ground-box" data-ground="marble" style="--thumb: url('./assets/marble-BEnUZwIr.jpg');" aria-label="Carrara Marble"></button>
    </div>

  </body>
</html>
